<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Snip AI account access layout preview</title>
  <desc id="desc">Illustrative sign-in screen with fictional example values.</desc>
  <defs><radialGradient id="glow"><stop stop-color="#ffad08" stop-opacity=".13"/><stop offset="1" stop-color="#ffad08" stop-opacity="0"/></radialGradient></defs>
  <rect width="1280" height="720" fill="#050505"/><ellipse cx="250" cy="120" rx="410" ry="300" fill="url(#glow)"/><ellipse cx="1120" cy="620" rx="380" ry="260" fill="url(#glow)"/>
  <rect x="410" y="70" width="460" height="580" rx="24" fill="#0c0c0c" stroke="#2e2e2e"/>
  <rect x="448" y="108" width="42" height="42" rx="13" fill="#ffad08"/><text x="469" y="137" text-anchor="middle" fill="#111" font-family="Arial" font-size="23" font-weight="700">S</text><text x="506" y="128" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Snip <tspan fill="#ffad08">AI</tspan></text><text x="506" y="147" fill="#888" font-family="Arial" font-size="11">AI clipping workspace</text>
  <text x="448" y="217" fill="#ffad08" font-family="Arial" font-size="11" font-weight="700" letter-spacing="1.5">WELCOME BACK</text><text x="448" y="260" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Welcome back.</text><text x="448" y="287" fill="#aaa" font-family="Arial" font-size="14">Login with your Snip AI account.</text>
  <text x="448" y="337" fill="#ddd" font-family="Arial" font-size="13" font-weight="600">Email</text><rect x="448" y="349" width="384" height="48" rx="12" fill="#050505" stroke="#383838"/><text x="468" y="379" fill="#777" font-family="Arial" font-size="14">you@example.com</text>
  <text x="448" y="431" fill="#ddd" font-family="Arial" font-size="13" font-weight="600">Password</text><rect x="448" y="443" width="384" height="48" rx="12" fill="#050505" stroke="#383838"/><text x="468" y="473" fill="#777" font-family="Arial" font-size="14">At least 6 characters</text>
  <rect x="448" y="518" width="384" height="50" rx="13" fill="#ffad08"/><text x="640" y="549" text-anchor="middle" fill="#111" font-family="Arial" font-size="14" font-weight="700">Login  →</text><text x="640" y="600" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="13">Don't have an account? <tspan fill="#ffad08" font-weight="700">Create Account</tspan></text><text x="640" y="630" text-anchor="middle" fill="#686868" font-family="Arial" font-size="11">Illustrative layout · no real account data</text>
</svg>
