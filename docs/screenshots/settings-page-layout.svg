  <g font-family="Arial">
    <g transform="translate(300 178)"><rect width="490" height="250" rx="18" fill="#0b0b0b" stroke="#303030"/><rect x="20" y="20" width="38" height="38" rx="12" fill="#1a150b" stroke="#50370b"/><text x="39" y="45" text-anchor="middle" fill="#ffad08" font-size="20">▣</text><text x="72" y="39" fill="#f5f5f5" font-size="16" font-weight="700">Generation defaults</text><text x="72" y="59" fill="#888" font-size="12">Starting values for Create</text><text x="24" y="98" fill="#ccc" font-size="13">Default video format</text><rect x="24" y="112" width="115" height="48" rx="12" fill="#201704" stroke="#ffad08" stroke-width="2"/><text x="81" y="141" text-anchor="middle" fill="#ffad08" font-size="14" font-weight="700">1:1</text><rect x="150" y="112" width="115" height="48" rx="12" fill="#0a0a0a" stroke="#333"/><text x="207" y="141" text-anchor="middle" fill="#ddd" font-size="14">16:9</text><text x="24" y="194" fill="#ccc" font-size="13">Default clip count</text><text x="448" y="194" text-anchor="end" fill="#ffad08" font-size="14" font-weight="700">5</text><rect x="24" y="208" width="442" height="5" rx="3" fill="#282828"/><rect x="24" y="208" width="196" height="5" rx="3" fill="#ffad08"/></g>
