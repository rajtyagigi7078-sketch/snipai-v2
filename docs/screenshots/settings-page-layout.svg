  <text x="28" y="112" fill="#9a9a9a" font-family="Arial" font-size="12" font-weight="700" letter-spacing="1.4">WORKSPACE</text><rect x="14" y="132" width="220" height="48" rx="12" fill="#151515"/><text x="32" y="162" fill="#ddd" font-family="Arial" font-size="15">▱  Auto Clipping</text><text x="32" y="218" fill="#aaa" font-family="Arial" font-size="15">◷  History</text><rect x="14" y="708" width="220" height="48" rx="12" fill="#151515"/><text x="32" y="738" fill="#ffad08" font-family="Arial" font-size="15" font-weight="700">⚙  Settings</text>
