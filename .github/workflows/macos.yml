name: macOS runtime validation
on:
  workflow_dispatch:
  push:
    branches: [release/v3-macos]
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install numpy av onnxruntime ctranslate2 faster-whisper yt-dlp huggingface-hub
      - run: npm ci
        working-directory: windows-runtime/pipeline/swift-node
      - name: Validate native speech imports
        run: |
          python -c "import numpy,av,onnxruntime,ctranslate2,faster_whisper; from faster_whisper.vad import get_vad_model; get_vad_model(); print('Native speech imports passed')"
          node -e "const ort=require('./windows-runtime/pipeline/swift-node/node_modules/onnxruntime-node');console.log(ort.env.versions)"
      - name: Validate desktop process handling
        run: node --test scripts/process-runner.test.cjs
      - name: Prepare bundled native speech runtime
        run: brew install ffmpeg dylibbundler
      - name: Bundle offline runtime
        run: python scripts/prepare-macos-runtime.py
      - name: Verify bundled engines
        run: .build/macos-runtime/python/bin/python3 .build/macos-runtime/pipeline/runtime_check.py --runtime .build/macos-runtime --output runtime-check.json
      - name: Build Mac installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --config electron-builder.mac.cjs --publish never
      - name: Launch packaged desktop app
        run: node scripts/macos-launch-smoke.cjs
      - name: Offline generation and export verification
        run: node scripts/macos-e2e.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.os }}
          path: |
            release-mac/*.dmg
            release-mac/*.zip
            macos-e2e-report.json
            .build/mac-ui-smoke/*
          include-hidden-files: true
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-ui-${{ matrix.os }}
          path: dist/
